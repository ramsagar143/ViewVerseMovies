<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0d0a1b" />
  <!-- Glowing Border -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="none" stroke="url(#neonGlow)" stroke-width="1" opacity="0.5" />
  <!-- Streaming Play Symbol fused with V (ViewVerse) -->
  <path d="M12 9 L22 16 L12 23 Z" fill="url(#neonGlow)" filter="url(#glow)" />
  <path d="M8 9 L11 16 L8 23" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
